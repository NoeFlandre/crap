[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
# The `crap` name is taken on PyPI; the command is still `crap`.
name = "crap-cli"
version = "0.1.0"
description = "An extremely fast CRAP score checker for Python, written in Rust."
authors = [{ name = "Noé Flandre" }]
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["crap", "complexity", "coverage", "testing", "linter", "static-analysis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Repository = "https://github.com/noeflandre/crap"
Documentation = "https://github.com/noeflandre/crap#readme"
Changelog = "https://github.com/noeflandre/crap/blob/main/CHANGELOG.md"
Issues = "https://github.com/noeflandre/crap/issues"

[tool.maturin]
bindings = "bin"
manifest-path = "crates/crap/Cargo.toml"
module-name = "crap"
python-source = "python"
strip = true
include = [{ path = "LICENSE", format = "sdist" }]
exclude = [
  { path = "crates/**/tests/**", format = "sdist" },
  { path = "crates/**/snapshots/**", format = "sdist" },
]
