name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10

jobs:
  fmt:
    name: "cargo fmt"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup component add rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: "cargo clippy | ${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: rustup component add clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: "cargo test | ${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
        env:
          INSTA_UPDATE: "no"

  conformance:
    name: "conformance | python ${{ matrix.python }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: "Install coverage.py, pytest and radon"
        run: python -m pip install coverage pytest radon
      - name: "Build"
        run: cargo build --release --locked --bin crap --example dump
      - name: "Per-function coverage matches coverage.py (line coverage)"
        run: python scripts/conformance.py target/release/crap scripts/conformance/project
      - name: "Per-function coverage matches coverage.py (branch coverage)"
        run: python scripts/conformance.py target/release/crap scripts/conformance/project --branch
      - name: "Statements, regions and complexity match coverage.py and radon on the stdlib"
        run: |
          STDLIB=$(python -c "import sysconfig; print(sysconfig.get_paths()['stdlib'])")
          python scripts/check_line_model.py target/release/examples/dump \
            $(find "$STDLIB" -name '*.py' -not -path '*/site-packages/*') \
            scripts/conformance/project/src/sample/*.py

  python-package:
    name: "python package"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - name: "Build the wheel and sdist"
        run: |
          uvx maturin build --release --out dist
          uvx maturin sdist --out dist
      - name: "Install and run the wheel"
        run: |
          uv venv
          uv pip install dist/*.whl
          .venv/bin/crap version
          .venv/bin/python -m crap version
          cd scripts/conformance/project
          uv pip install coverage pytest
          ../../../.venv/bin/python -m coverage run -m pytest -q
          ../../../.venv/bin/crap check --exit-zero
          ../../../.venv/bin/crap report --top 5

  msrv:
    name: "cargo check | msrv"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: "Check with the minimum supported Rust version"
        run: |
          MSRV=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          rustup toolchain install "$MSRV" --profile minimal
          cargo +"$MSRV" check --workspace --locked
